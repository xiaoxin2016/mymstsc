name: Release

# Publishing a tag that starts with "v" builds the Windows binaries and creates
# the matching GitHub release. A tag containing a hyphen (v1.2.0-rc.1) is
# published as a pre-release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The struct layout, vtable and HRESULT tests only compile on Windows, and a
  # tag must not publish binaries that fail them.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test
        run: go test ./...
      - name: Vet
        # The COM boundary dereferences pointers the control owns, which the
        # unsafeptr check cannot tell apart from a real mistake.
        run: go vet -unsafeptr=false ./...

  release:
    needs: windows-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are built from the log since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: ./package.sh

      - name: Write release notes
        run: ./release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A hyphen in the tag marks a pre-release: v1.2.0-rc.1, v1.2.0-beta.
          case "${GITHUB_REF_NAME}" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "mymstsc ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            ${PRERELEASE} \
            dist/*.zip \
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mymstsc-${{ github.ref_name }}-windows-amd64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

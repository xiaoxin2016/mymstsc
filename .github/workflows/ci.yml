name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o mymstsc.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: mymstsc-windows-amd64
          path: mymstsc.exe

  windows:
    # Runs the tests that only compile on Windows: struct layouts, vtable
    # shapes and the HRESULT constants.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: test
        run: go test ./...
      - name: vet
        # The COM boundary dereferences pointers the control owns, which the
        # unsafeptr check cannot tell apart from a real mistake.
        run: go vet -unsafeptr=false ./...
